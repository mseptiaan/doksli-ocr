<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>doksli-ocr Demo</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1d2330; --muted:#667085; --line:#e4e7ec; --accent:#1f6feb; --warn:#b54708; --warn-bg:#fffaeb; --ok:#067647; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1115; --card:#171a21; --ink:#e6e8ec; --muted:#98a2b3; --line:#2a2f3a; --accent:#58a6ff; --warn:#fdb022; --warn-bg:#2a2112; --ok:#47cd89; } }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width:1100px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 20px; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
  .row { display:grid; grid-template-columns: minmax(0,1.2fr) minmax(0,1fr); gap:16px; margin-top:16px; }
  @media (max-width: 820px) { .row { grid-template-columns: 1fr; } }
  .pick { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  button, label.btn { font:inherit; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:8px; padding:9px 14px; cursor:pointer; }
  label.btn.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  input[type=file] { display:none; }
  #status { color:var(--muted); font-size:14px; }
  canvas { width:100%; height:auto; border-radius:8px; display:block; background:var(--bg); }
  table { width:100%; border-collapse:collapse; }
  td { padding:6px 4px; border-bottom:1px solid var(--line); vertical-align:middle; }
  td:first-child { color:var(--muted); width:38%; font-size:13px; }
  td input { width:100%; font:inherit; color:var(--ink); background:transparent; border:1px solid transparent; border-radius:6px; padding:4px 6px; }
  td input:focus { border-color:var(--accent); outline:none; }
  td input.check { border-color:var(--warn); background:var(--warn-bg); }
  .chk { font-size:11px; color:var(--warn); border:1px solid var(--warn); border-radius:999px; padding:0 6px; margin-left:4px; }
  mark { background:var(--warn-bg); color:var(--warn); border-bottom:1px solid var(--warn); }
  .badge { display:inline-block; font-size:12px; padding:2px 8px; border-radius:999px; background:var(--bg); border:1px solid var(--line); margin-right:6px; }
  .issues { margin-top:10px; padding:10px 12px; border-radius:8px; background:var(--warn-bg); color:var(--warn); font-size:13px; display:none; }
  .ok { color:var(--ok); font-size:13px; margin-top:10px; display:none; }
  .meta { color:var(--muted); font-size:13px; margin-top:8px; }
  pre { white-space:pre-wrap; word-break:break-word; font-size:12px; background:var(--bg); padding:10px; border-radius:8px; max-height:220px; overflow:auto; }
  details { margin-top:12px; }
</style>
<!-- Import map: pakai paket lokal. Untuk CDN, lihat README (bagian "Tanpa bundler"). -->
<script type="importmap">
{
  "imports": {
    "onnxruntime-web": "../../node_modules/onnxruntime-web/dist/ort.wasm.min.mjs",
    "doksli-ocr": "../../src/index.js"
  }
}
</script>
</head>
<body>
<main>
  <h1>doksli-ocr: KTP &amp; NPWP</h1>
  <p class="sub">Semua proses berjalan di perangkat ini. Foto tidak dikirim ke server mana pun.</p>

  <div class="panel pick">
    <label class="btn primary" for="file">Pilih / potret foto</label>
    <input id="file" type="file" accept="image/*" capture="environment">
    <span id="status">Memuat model…</span>
  </div>

  <div class="row" id="result" hidden>
    <div class="panel">
      <canvas id="card" aria-label="Kartu yang sudah diluruskan"></canvas>
      <div class="meta" id="meta"></div>
    </div>
    <div class="panel">
      <div><span class="badge" id="doctype"></span><span class="badge" id="mode"></span></div>
      <table><tbody id="fields"></tbody></table>
      <div class="issues" id="issues"></div>
      <p class="meta">Field bertanda <span class="chk">periksa</span>: keyakinan OCR rendah, gagal pemeriksaan format, atau kosong.</p>
      <details><summary>JSON</summary><pre id="json"></pre></details>
    </div>
  </div>
</main>

<script type="module">
  import { createOcr } from "doksli-ocr";

  const FIELDS = {
    ktp: [["nik","NIK"],["nama","Nama"],["tempat_lahir","Tempat lahir"],["tanggal_lahir","Tanggal lahir"],["jenis_kelamin","Jenis kelamin"],
          ["gol_darah","Gol. darah"],["alamat","Alamat"],["rt_rw","RT/RW"],["kel_desa","Kel/Desa"],["kecamatan","Kecamatan"],
          ["kabupaten_kota","Kabupaten/Kota"],["provinsi","Provinsi"],["agama","Agama"],["status_perkawinan","Status perkawinan"],
          ["pekerjaan","Pekerjaan"],["kewarganegaraan","Kewarganegaraan"],["berlaku_hingga","Berlaku hingga"]],
    npwp: [["npwp","NPWP"],["nik","NIK"],["nama","Nama"],["alamat","Alamat"],["kpp","KPP"]],
  };
  const $ = (id) => document.getElementById(id);

  let n = 0, ocr;
  try {
    ocr = await createOcr({
      wasmPaths: new URL("../../node_modules/onnxruntime-web/dist/", location.href).href,
      onProgress: () => { $("status").textContent = `Memuat model… ${++n}/5`; },
    });
    $("status").textContent = "Siap.";
  } catch (e) {
    $("status").textContent = "Gagal memuat: " + e.message;
  }

  $("file").addEventListener("change", async (ev) => {
    const f = ev.target.files[0];
    if (!f || !ocr) return;
    $("status").textContent = "Memproses…";
    try {
      const res = await ocr.recognize(f);
      show(res);
      $("status").textContent = `Selesai dalam ${(res.timeMs / 1000).toFixed(2)} detik.`;
    } catch (e) {
      $("status").textContent = e.message;
    }
  });

  function show(res) {
    $("result").hidden = false;
    const cv = $("card");
    const card = res.cardCanvas?.();
    if (card) { cv.width = card.width; cv.height = card.height; cv.getContext("2d").drawImage(card, 0, 0); }
    else { cv.width = 1; cv.height = 1; }
    const ctx = cv.getContext("2d");
    if (card) {
      ctx.strokeStyle = "rgba(31,111,235,.9)"; ctx.lineWidth = 2;
      for (const l of res.lines) { ctx.beginPath(); l.box.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath(); ctx.stroke(); }
    }
    $("doctype").textContent = res.docType.toUpperCase();
    $("mode").textContent = res.mode === "warp" ? "kartu diluruskan" : "foto penuh";
    $("meta").textContent = `${res.lines.length} baris teks · ${res.timeMs} ms`;
    const review = new Set(res.needsReview);
    const tb = $("fields"); tb.innerHTML = "";
    for (const [k, label] of FIELDS[res.docType]) {
      const check = review.has(k) || (!res.fields[k] && k !== "gol_darah");
      const tr = document.createElement("tr");
      tr.innerHTML = `<td>${label}${check ? ' <span class="chk">periksa</span>' : ""}</td><td><input aria-label="${label}"></td>`;
      const inp = tr.querySelector("input");
      inp.value = res.fields[k] || "";
      if (check) inp.classList.add("check");
      tb.appendChild(tr);
    }
    $("issues").style.display = res.issues.length ? "block" : "none";
    $("issues").textContent = res.issues.length ? "Periksa: " + res.issues.join(", ") : "";
    const { cardCanvas, lines, ...rest } = res;
    $("json").textContent = JSON.stringify(rest, null, 2);
  }
</script>
</body>
</html>
